<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Floricultura da resenha</title>
</head>
<body>
    <h1>Catálogo de Plantas - Floricultura da resenha</h1>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="catalogo.html">Catalogo</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="simulador.html">Simulador</a></li>
            <li><a href="sobre.html">Sobre</a></li>
        </ul>
    </nav>

    <hr>

    <div>
        <h3>Filtrar por Categoria:</h3>
        <button onclick="filtrarPlantas('todas')">Todas as Plantas</button>
        <button onclick="filtrarPlantas('flores')">Flores</button>
        <button onclick="filtrarPlantas('cactos')">Cactos e Suculentas</button>
        <button onclick="filtrarPlantas('exoticas')">Exóticas</button>
    </div>

    <br>


    <div>
        <p>
            <strong>Plantas exibidas:</strong> <span id="contador-itens">0</span> | 
            <strong>Soma dos preços exibidos:</strong> R$ <span id="valor-total">0,00</span>
        </p>
    </div>

    <hr>

 
    <div id="lista-plantas"></div>

  
    <script>
        
        const plantas = [
            {
                nome: "1. Girassol",
                categoria: "flores",
                preco: 35.00,
                imagem: "img/girassol.png",
                descricao: "Ilumina o seu quintal, afasta os entrosas com seu brilho e ainda alegra a sala!",
                link: "ver/girassol.html"
            },
            {
                nome: "2. Rosa",
                categoria: "flores",
                preco: 25.00,
                imagem: "img/rosa.png",
                descricao: "Adicione beleza e perfume ao seu jardim com nossa seleção de rosas coloridas.",
                link: "ver/rosa.html"
            },
            {
                nome: "3. Cacto",
                categoria: "cactos",
                preco: 40.00,
                imagem: "img/cacto.png",
                descricao: "Perfeito para quem busca uma planta que espete os entrosas e decore o ambiente.",
                link: "ver/cacto.html"
            },
            {
                nome: "4. Colar-de-Pérolas (Disparervilha)",
                categoria: "cactos",
                preco: 50.00,
                imagem: "img/disparervilha.png",
                descricao: "Suculenta cheia de bolinhas verdes. Igualzinha a do jogo, ótima para vasos suspensos.",
                link: "ver/disparervilha.html"
            },
            {
                nome: "5. Planta Carnívora (Chomper)",
                categoria: "exoticas",
                preco: 65.00,
                imagem: "img/carnivora.png",
                descricao: "Visual clássico do jogo e ainda acaba com os mosquitos e pernilongos da casa.",
                link: "ver/carnivora.html"
            },
            {
                nome: "6. Mini Cogumelo Decorativo",
                categoria: "exoticas",
                preco: 30.00,
                imagem: "img/cogumelo.png",
                descricao: "Terrário fechado para cantinhos com sombra. A cara das fases noturnas.",
                link: "ver/cogumelo.html"
            },
            {
                nome: "7. batatão",
                categoria: "exoticas",
                preco: 15.00,
                imagem:"img/batatao.png",
                descricao: "batatão é uma planta que se parece com uma batata gigante.",
                link: "ver/batatão.html"
            }
        ];

    
        function mostrarPlantas(listaFiltrada) {
            const container = document.getElementById("lista-plantas");
            const spanContador = document.getElementById("contador-itens");
            const spanTotal = document.getElementById("valor-total");

            container.innerHTML = "";
            let somaPreco = 0;

            listaFiltrada.forEach(planta => {
                somaPreco += planta.preco;

                container.innerHTML += `
                    <div style="border: 1px solid black; padding: 10px; margin-bottom: 15px; width: 300px;">
                        <img src="${planta.imagem}" alt="${planta.nome}" width="150" height="150">
                        <h3>${planta.nome}</h3>
                        <p><strong>Categoria:</strong> ${planta.categoria}</p>
                        <p>${planta.descricao}</p>
                        <p><strong>Preço:</strong> R$ ${planta.preco.toFixed(2).replace('.', ',')}</p>
                        <a href="${planta.link}">Ver produto</a>
                    </div>
                `;
            });

            spanContador.innerText = listaFiltrada.length;
            spanTotal.innerText = somaPreco.toFixed(2).replace('.', ',');
        }

        function filtrarPlantas(categoriaEscolhida) {
            if (categoriaEscolhida === "todas") {
                mostrarPlantas(plantas);
            } else {
                const filtradas = plantas.filter(planta => planta.categoria === categoriaEscolhida);
                mostrarPlantas(filtradas);
            }
        }

       
        mostrarPlantas(plantas);
    </script>
</body>
</html>
